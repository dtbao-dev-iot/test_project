name: Embedded C CI (ESP-IDF)

on:
  push:
    branches:
      - main
      - developing
  pull_request:
    branches:
      - main
      - developing
  workflow_dispatch:

env:
  IDF_GIT_SAFE_DIR: '*'

# ─────────────────────────────────────────────────────────
# Job 1: Code Style Check (clang-format)
# ─────────────────────────────────────────────────────────
jobs:
  code-style:
    name: Code Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check C/H files formatting
        run: |
          FILES=$(find . -type f \( -name "*.c" -o -name "*.h" \) \
            ! -path "./.git/*" \
            ! -path "./build/*" \
            ! -path "./managed_components/*" \
            ! -path "./out/*" || true)

          if [ -z "$FILES" ]; then
            echo "No C/H files found. Skipping style check."
            exit 0
          fi

          echo "Checking formatting on:"
          echo "$FILES"
          echo ""

          echo "$FILES" | xargs clang-format --dry-run --Werror

  # ─────────────────────────────────────────────────────────
  # Job 2: Static Analysis (cppcheck)
  # ─────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --std=c11 \
            --quiet \
            --exclude=build \
            --exclude=managed_components \
            --exclude=out \
            .

  # ─────────────────────────────────────────────────────────
  # Job 3: ESP-IDF Build (Docker)
  # ─────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [code-style, static-analysis]
    container:
      image: espressif/idf:v5.5.3
      env:
        IDF_CCACHE_ENABLE: 1

    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: esp-idf-${{ matrix.target }}-${{ github.job }}
          append-timestamp: false

      - name: Build
        run: |
          . /opt/esp/idf/export.sh
          python docs/scripts/build.py --all --ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware_${{ matrix.target }}
          path: workspaces/release/release/${{ matrix.target }}/
          retention-days: 7