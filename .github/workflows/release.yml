name: Release

# Trigger on tags matching the project version format.
# firmware-dev  : use  V[0-9]*   (e.g. V26.04.00)
# firmware-libs : use  v[0-9]*   (e.g. v1.0.0)
on:
  push:
    tags:
      - 'V[0-9]*'

permissions:
  contents: write

env:
  IDF_GIT_SAFE_DIR: '*'

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Validate VERSION and CHANGELOG
  # ─────────────────────────────────────────────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify changelog exists
        run: |
          CHANGELOG_FILE="docs/CHANGELOG/${{ steps.version.outputs.VERSION }}"
          if [ ! -f "${CHANGELOG_FILE}.md" ]; then
            echo "ERROR: ${CHANGELOG_FILE}.md not found."
            echo "Create a changelog entry before releasing."
            exit 1
          fi
          if [ ! -s "${CHANGELOG_FILE}.md" ]; then
            echo "ERROR: ${CHANGELOG_FILE}.md is empty."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────
  # Job 2: Build firmware (ESP-IDF Docker)
  # ─────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate
    container:
      image: espressif/idf:v5.5.3
      env:
        IDF_CCACHE_ENABLE: 1

    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-${{ matrix.target }}-${{ github.job }}
          append-timestamp: false

      - name: Build
        run: |
          . /opt/esp/idf/export.sh
          python docs/scripts/build.py --all --ci --build-type release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware_${{ matrix.target }}
          path: workspaces/release/release/${{ matrix.target }}/
          retention-days: 90

  # ─────────────────────────────────────────────────────────
  # Job 3: Create GitHub Release with firmware artifacts
  # ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body_path: docs/CHANGELOG/${{ steps.version.outputs.VERSION }}.md
          files: release-artifacts/**
          draft: false
          prerelease: false